<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Forgot Password - AdminPro</title>

    <!-- Bootstrap 5.3.8 LTR -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- Auth Only -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-ltr.css">
</head>

<body>

    <!-- Theme -->
    <button type="button" class="theme-toggle" id="themeToggle" title="Dark / Light Mode" aria-label="Dark / Light Mode">
        <i class="fa-solid fa-moon"></i>
    </button>


    <main class="auth-page">

        <div class="auth-container">

            <!-- Brand -->
            <a href="login.html" class="auth-brand">

                <span class="auth-brand-icon">
                    <i class="fa-solid fa-layer-group"></i>
                </span>

                <span class="auth-brand-name">
                    AdminPro
                </span>

            </a>


            <!-- Forgot Password Card -->
            <section class="auth-card">

                <!-- Header -->
                <div class="auth-card-header">

                    <h1>Forgot Password?</h1>

                    <p>
                        Enter your email and we'll send you a reset link
                    </p>

                </div>


                <!-- Body -->
                <div class="auth-card-body">

                    <form id="forgotPasswordForm" action="" method="POST">

                        <!-- Email -->
                        <div class="mb-3">

                            <label for="email" class="form-label">
                                Email Address
                            </label>

                            <div class="input-group input-group-sm">

                                <span class="input-group-text">
                                    <i class="fa-regular fa-envelope"></i>
                                </span>

                                <input type="email" class="form-control form-control-sm" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>

                            </div>

                        </div>


                        <!-- Submit -->
                        <button type="submit" class="btn btn-primary btn-sm auth-submit w-100">

                            <i class="fa-regular fa-paper-plane auth-btn-icon"></i>

                            <span>
                                Send Reset Link
                            </span>

                        </button>

                    </form>

                </div>


                <!-- Footer -->
                <div class="auth-card-footer">

                    <a href="login.html" class="auth-link">

                        <i class="fa-solid fa-arrow-left me-1"></i>

                        Back to Sign In

                    </a>

                </div>

            </section>

        </div>

    </main>


    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Auth JavaScript -->
    <script src="javascript.js"></script>

</body>
</html>
