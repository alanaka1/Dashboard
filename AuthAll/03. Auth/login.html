<!doctype html>

<html lang="en" dir="ltr" data-bs-theme="light">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login - AdminPro</title>

        <!-- Bootstrap 5.3.8 LTR -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">


        <!-- Main Style -->
        <link rel="stylesheet" href="style-pro.css">


        <!-- Direction -->
        <link rel="stylesheet" href="style-ltr-pro.css">

        <!-- Auth -->
        <link rel="stylesheet" href="auth-pro.css">

    </head>


    <body>


        <button class="btn btn-icon auth-theme-button" id="themeToggle" type="button" title="Dark / Light Mode">
            <i class="fa-solid fa-moon"></i>
        </button>


        <main class="auth-page">
            <div class="auth-wrapper">
                <!-- Brand -->
                <a href="index-pro.html" class="auth-brand">
                    <span class="auth-brand-icon"><i class="fa-solid fa-layer-group"></i></span>
                    <span class="auth-brand-text">AdminPro</span>
                </a>
                <!-- Card -->
                <div class="auth-card">
                    <div class="auth-header">
                        <h1>Welcome Back</h1>
                        <p>Sign in to continue to your dashboard</p>
                    </div>
                    <div class="auth-body">
                        <form id="loginForm" action="" method="POST">

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                                    <input type="email" class="form-control form-control-sm" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-2">
                                <div class="d-flex align-items-center justify-content-between">
                                    <label for="password" class="form-label">Password</label>
                                    <a href="#" class="auth-link">Forgot Password?</a>
                                </div>

                                <div class="input-group input-group-sm">
                                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" class="form-control form-control-sm" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>

                                    <button class="password-toggle" type="button" data-password-toggle="password">
                                        <i class="fa-regular fa-eye"></i>
                                    </button>
                                </div>
                            </div>


                            <!-- Remember -->
                            <div class="d-flex align-items-center justify-content-between my-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                    <label class="form-check-label small" for="remember">Remember me</label>
                                </div>
                            </div>

                            <!-- Submit -->
                            <button type="submit" class="btn btn-primary btn-sm auth-submit w-100">
                                <i class="fa-solid fa-right-to-bracket me-1"></i>Sign In
                            </button>
                        </form>
                    </div>
                    <div class="auth-footer">
                        Don't have an account?
                        <a href="register.html" class="auth-link ms-1">Create Account</a>
                    </div>
                </div>
            </div>
        </main>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="auth-pro.js"></script>

    </body>
</html>
