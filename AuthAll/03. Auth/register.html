<!doctype html>

<html lang="en" dir="ltr" data-bs-theme="light">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Register - AdminPro</title>


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    >

    <link rel="stylesheet" href="style-pro.css">

    <link rel="stylesheet" href="style-ltr-pro.css">

    <link rel="stylesheet" href="auth-pro.css">

</head>


<body>


<button
    class="btn btn-icon auth-theme-button"
    id="themeToggle"
    type="button"
>
    <i class="fa-solid fa-moon"></i>
</button>


<main class="auth-page">

    <div class="auth-wrapper">


        <a
            href="index-pro.html"
            class="auth-brand"
        >

            <span class="auth-brand-icon">
                <i class="fa-solid fa-layer-group"></i>
            </span>

            <span class="auth-brand-text">
                AdminPro
            </span>

        </a>


        <div class="auth-card">


            <div class="auth-header">

                <h1>Create Account</h1>

                <p>
                    Create your account to get started
                </p>

            </div>


            <div class="auth-body">


                <form
                    id="registerForm"
                    action=""
                    method="POST"
                >


                    <!-- Name -->
                    <div class="mb-3">

                        <label
                            for="name"
                            class="form-label"
                        >
                            Full Name
                        </label>

                        <div class="input-group input-group-sm">

                            <span class="input-group-text">
                                <i class="fa-regular fa-user"></i>
                            </span>

                            <input
                                type="text"
                                class="form-control form-control-sm"
                                id="name"
                                name="name"
                                placeholder="Full name"
                                required
                            >

                        </div>

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label"
                        >
                            Email Address
                        </label>

                        <div class="input-group input-group-sm">

                            <span class="input-group-text">
                                <i class="fa-regular fa-envelope"></i>
                            </span>

                            <input
                                type="email"
                                class="form-control form-control-sm"
                                id="email"
                                name="email"
                                placeholder="name@example.com"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->
                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Password
                        </label>

                        <div class="input-group input-group-sm">

                            <span class="input-group-text">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control form-control-sm"
                                id="password"
                                name="password"
                                placeholder="Create password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="password"
                            >

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <!-- Confirm Password -->
                    <div class="mb-3">

                        <label
                            for="passwordConfirmation"
                            class="form-label"
                        >
                            Confirm Password
                        </label>

                        <div class="input-group input-group-sm">

                            <span class="input-group-text">
                                <i class="fa-solid fa-shield-halved"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control form-control-sm"
                                id="passwordConfirmation"
                                name="password_confirmation"
                                placeholder="Confirm password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="passwordConfirmation"
                            >

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <!-- Terms -->
                    <div class="form-check mb-3">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <label
                            class="form-check-label small"
                            for="terms"
                        >
                            I agree to the terms and conditions
                        </label>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary btn-sm auth-submit w-100"
                    >

                        <i class="fa-solid fa-user-plus me-1"></i>

                        Create Account

                    </button>

                </form>

            </div>


            <div class="auth-footer">

                Already have an account?

                <a
                    href="login.html"
                    class="auth-link ms-1"
                >
                    Sign In
                </a>

            </div>

        </div>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>

<script src="auth-pro.js"></script>

</body>

</html>
