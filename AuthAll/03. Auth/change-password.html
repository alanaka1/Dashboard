<!doctype html>

<html lang="en" dir="ltr" data-bs-theme="light">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Change Password - AdminPro</title>


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    >

    <link rel="stylesheet" href="style-pro.css">

    <link rel="stylesheet" href="style-ltr-pro.css">

    <link rel="stylesheet" href="auth-pro.css">

</head>


<body>


<button
    class="btn btn-icon auth-theme-button"
    id="themeToggle"
    type="button"
>
    <i class="fa-solid fa-moon"></i>
</button>


<main class="auth-page">

    <div class="auth-wrapper">


        <a
            href="index-pro.html"
            class="auth-brand"
        >

            <span class="auth-brand-icon">

                <i class="fa-solid fa-layer-group"></i>

            </span>

            <span class="auth-brand-text">
                AdminPro
            </span>

        </a>


        <div class="auth-card">


            <div class="auth-header">

                <h1>Change Password</h1>

                <p>
                    Update your account password
                </p>

            </div>


            <div class="auth-body">


                <form
                    id="changePasswordForm"
                    action=""
                    method="POST"
                >


                    <!-- Current Password -->
                    <div class="mb-3">

                        <label
                            for="currentPassword"
                            class="form-label"
                        >
                            Current Password
                        </label>

                        <div class="input-group input-group-sm">

                            <span class="input-group-text">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control form-control-sm"
                                id="currentPassword"
                                name="current_password"
                                placeholder="Current password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="currentPassword"
                            >

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <!-- New Password -->
                    <div class="mb-3">

                        <label
                            for="newPassword"
                            class="form-label"
                        >
                            New Password
                        </label>

                        <div class="input-group input-group-sm">

                            <span class="input-group-text">
                                <i class="fa-solid fa-key"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control form-control-sm"
                                id="newPassword"
                                name="password"
                                placeholder="New password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="newPassword"
                            >

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>


                        <div class="password-rules">

                            <div class="password-rule">

                                <i class="fa-solid fa-circle-check"></i>

                                Minimum 8 characters

                            </div>

                            <div class="password-rule">

                                <i class="fa-solid fa-circle-check"></i>

                                Use uppercase and lowercase letters

                            </div>

                            <div class="password-rule">

                                <i class="fa-solid fa-circle-check"></i>

                                Include at least one number

                            </div>

                        </div>

                    </div>


                    <!-- Confirm -->
                    <div class="mb-4">

                        <label
                            for="confirmPassword"
                            class="form-label"
                        >
                            Confirm New Password
                        </label>

                        <div class="input-group input-group-sm">

                            <span class="input-group-text">
                                <i class="fa-solid fa-shield-halved"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control form-control-sm"
                                id="confirmPassword"
                                name="password_confirmation"
                                placeholder="Confirm new password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="confirmPassword"
                            >

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary btn-sm auth-submit w-100"
                    >

                        <i class="fa-solid fa-key me-1"></i>

                        Update Password

                    </button>

                </form>

            </div>


            <div class="auth-footer">

                <a
                    href="index-pro.html"
                    class="auth-link"
                >

                    <i class="fa-solid fa-arrow-left me-1"></i>

                    Back to Dashboard

                </a>

            </div>

        </div>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>

<script src="auth-pro.js"></script>

</body>

</html>
